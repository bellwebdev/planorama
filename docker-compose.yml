services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Host 8080: local port 80 is held by Laravel Valet's nginx on another macOS account.
      - "8080:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Db: Host=db;Database=${POSTGRES_DB:-planorama};Username=${POSTGRES_USER:-planorama};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: cache:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Email__ConfirmationUrlBase: ${FRONTEND_ORIGIN:-http://localhost:5173}/confirm-email
      Google__ClientId: ${GOOGLE_OAUTH_CLIENT_ID}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY}
      R2__AccountId: ${R2_ACCOUNT_ID}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      R2__BucketName: ${R2_BUCKET_NAME}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      target: worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Db: Host=db;Database=${POSTGRES_DB:-planorama};Username=${POSTGRES_USER:-planorama};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: cache:6379
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@planorama.family}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planorama}
      POSTGRES_USER: ${POSTGRES_USER:-planorama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Host 5434: local 5432 is taken by Homebrew Postgres, 5433 by another project.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planorama} -d ${POSTGRES_DB:-planorama}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7
    restart: unless-stopped
    volumes:
      - cache_data:/data

volumes:
  db_data:
  cache_data:
  caddy_data:
  caddy_config:
